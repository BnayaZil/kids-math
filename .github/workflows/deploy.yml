name: Deploy to GitHub Pages

# Build the games and publish them to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  # Allow a manual run from the Actions tab (handy right after enabling Pages).
  workflow_dispatch:

# Least-privilege token: publishing to Pages needs write access to Pages and an
# OIDC token to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time. Don't cancel a deploy that's already running —
# let it finish — but collapse any pushes queued behind it so they can't race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
